<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>JulianTracker</title>
  <style>
    body {
      background: #f4f3f1;
      font-family: 'Helvetica Neue', Arial, sans-serif;
      text-align: center;
      padding: 70px 20px;
      color: #111;
    }
    h1 {
      font-size: 48px;
      font-weight: 300;
      letter-spacing: 4px;
      margin-bottom: 40px;
      text-transform: uppercase;
    }
    .track {
      margin: 50px 0;
    }
    audio {
      width: 80%;
      max-width: 500px;
    }
  </style>
</head>
<body>
  <h1>JulianTracker</h1>

  <p>Bienvenidos. Aquí podrán escuchar mis álbumes y canciones.</p>

  <div class="track">
    <p>Mi Primera Canción</p>
    <audio controls>
      <source src="track1.mp3" type="audio/mpeg">
    </audio>
  </div>

</body>
</html>
